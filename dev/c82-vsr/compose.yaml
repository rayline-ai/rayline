name: c82-vsr-live

services:
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -ceu
      - 'exec redis-server --save "" --appendonly no --requirepass "$$C82_VSR_REDIS_PASSWORD"'
    environment:
      C82_VSR_REDIS_PASSWORD: ${C82_VSR_REDIS_PASSWORD:?set by scripts/c82-dev}
      REDISCLI_AUTH: ${C82_VSR_REDIS_PASSWORD:?set by scripts/c82-dev}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  router:
    image: ${C82_VSR_ROUTER_IMAGE:-ghcr.io/vllm-project/semantic-router/vllm-sr:latest}
    pull_policy: never
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?source ~/.bash_profile}
      RAYLINE_ARC_MODAL_KEY: ${RAYLINE_ARC_MODAL_KEY:?loaded from the private dev proxy token}
      RAYLINE_ARC_MODAL_SECRET: ${RAYLINE_ARC_MODAL_SECRET:?loaded from the private dev proxy token}
      C82_VSR_REDIS_PASSWORD: ${C82_VSR_REDIS_PASSWORD:?set by scripts/c82-dev}
    command: ["/app/config/c82-vsr.json"]
    volumes:
      - ${C82_VSR_CONFIG_PATH:?generated by scripts/c82-dev}:/app/config/c82-vsr.json:ro
      - ${C82_VSR_ARTIFACT_DIR:?provisioned by C82 doctor}:/var/lib/vllm-sr/rayline-arc:ro
      - ${C82_VSR_MODELS_DIR:?provisioned by scripts/c82-dev}:/app/models:ro
    ports:
      - "${C82_VSR_API_PORT:-18882}:8080"
      - "${C82_VSR_METRICS_PORT:-19192}:9190"
    depends_on:
      redis:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.34-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${C82_VSR_ENVOY_PORT:-18888}:8888"
    depends_on:
      - router
